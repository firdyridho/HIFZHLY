name: Build Hifzhly Mobile App (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - all
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/build-mobile.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Ensure Persistent Android Keystore
        working-directory: frontend/android
        run: |
          if [ ! -f hifzhly.keystore ]; then
            echo "Generating persistent keystore for continuous app updates..."
            keytool -genkey -v -keystore hifzhly.keystore -alias hifzhly -keyalg RSA -keysize 2048 -validity 10000 -storepass hifzhly2026 -keypass hifzhly2026 -dname "CN=Hifzhly, OU=Engineering, O=FIFA, L=Jakarta, ST=DKI, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hifzhly.keystore
            git commit -m "chore(android): persist fixed signing keystore" || true
            git push origin ${{ github.ref_name }} || true
          fi

      - name: Build Android Debug APK with Dynamic Version
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PprojVersionCode=${{ github.run_number }} -PprojVersionName=1.0.${{ github.run_number }} --stacktrace

      - name: Prepare Versioned APK Files
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.${{ github.run_number }}.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-latest.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifzhly-Android-v1.0.${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate Dynamic Release Notes
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-v:refname | head -n 1 || true)
          echo "Previous release tag: $PREV_TAG"

          cat << 'EOF' > RELEASE_NOTES.md
          Pembaruan resmi aplikasi Android Hifzhly.

          Informasi Rilis:
          - Versi: 1.0.${{ github.run_number }} (Build #${{ github.run_number }})
          - Tim Pengembang: Firdy Ridho Fillah & Faeyza Ardellein Yaradhitya (Tim FIFA)

          Catatan Pembaruan Terbaru:
          EOF

          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" -n 12 | grep -v "persist fixed signing keystore" || true)
          else
            CHANGES=""
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES=$(git log --no-merges --pretty=format:"- %s" -n 6 | grep -v "persist fixed signing keystore" || true)
          fi

          if [ -z "$CHANGES" ]; then
            echo "- Peningkatan performa aplikasi dan stabilitas fitur hafalan." >> RELEASE_NOTES.md
          else
            printf "%s\n" "$CHANGES" >> RELEASE_NOTES.md
          fi

          cat RELEASE_NOTES.md

      - name: Publish Public Release for 1-Click Direct Download & Auto-Update
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hifzhly Android App v1.0.${{ github.run_number }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.${{ github.run_number }}.apk
            frontend/android/app/build/outputs/apk/debug/hifzhly-latest.apk
            frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
