name: Build Hifzhly Mobile App (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - all
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/build-mobile.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK with Dynamic Version
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PprojVersionCode=${{ github.run_number }} -PprojVersionName=1.0.${{ github.run_number }} --stacktrace

      - name: Prepare Versioned APK Files
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.${{ github.run_number }}.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-latest.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifzhly-Android-v1.0.${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Public Release for 1-Click Direct Download & Auto-Update
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Hifzhly Android App v1.0.${{ github.run_number }}
          body: |
            Unduh langsung berkas instalasi resmi Hifzhly untuk smartphone Android.
            - Versi: 1.0.${{ github.run_number }}
            - Build Number: ${{ github.run_number }}
            - Lead Developer: Firdy Ridho Fillah (FIFA)
            - Pembaruan: In-app auto-update background download, permissions lengkap, & splash screen clean.
          files: |
            frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.${{ github.run_number }}.apk
            frontend/android/app/build/outputs/apk/debug/hifzhly-latest.apk
            frontend/android/app/build/outputs/apk/debug/hifzhly-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
