name: Build & Deploy Go Backend to VPS

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'backend/**'
      - 'services/ai-worker/**'
      - 'docker-compose.yml'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Compile Go & Ship Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Compile Single Go Binary
        run: |
          cd backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o server ./cmd/api
          ls -lh server

      - name: Ship Binary & Migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend/server,backend/migrations/*"
          target: "/opt/hifzhly"
          strip_components: 1

      - name: Ship AI Worker & Compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "services/ai-worker/*,docker-compose.yml,deploy.sh"
          target: "/opt/hifzhly"

      - name: Restart Backend & AI Worker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Beri izin eksekusi pada binary dan script
            chmod +x /opt/hifzhly/server
            [ -f /opt/hifzhly/deploy.sh ] && chmod +x /opt/hifzhly/deploy.sh
            
            # 2. Setup Systemd Service jika belum terdaftar
            if [ ! -f /etc/systemd/system/hifzhly.service ]; then
              cat << 'EOF' > /etc/systemd/system/hifzhly.service
            [Unit]
            Description=Hifzhly Go Backend Service
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/hifzhly
            ExecStart=/opt/hifzhly/server
            Restart=always
            RestartSec=3
            Environment=APP_PORT=8080
            Environment=APP_ENV=production
            Environment=DATABASE_URL=postgres://hifzhly_user:hifzhly_secure_password_2026@127.0.0.1:5432/hifzhly_db?sslmode=disable
            Environment=REDIS_HOST=127.0.0.1
            Environment=REDIS_PORT=6379
            Environment=JWT_SECRET=hifzhly_fifa_secret_key_prod_2026_xyz!
            Environment=AI_WORKER_URL=http://127.0.0.1:5000

            [Install]
            WantedBy=multi-user.target
            EOF
              systemctl daemon-reload
              systemctl enable hifzhly.service
            else
              # Pastikan AI_WORKER_URL ada di unit service yang sudah ada
              if ! grep -q "AI_WORKER_URL" /etc/systemd/system/hifzhly.service; then
                sed -i '/Environment=JWT_SECRET/a Environment=AI_WORKER_URL=http://127.0.0.1:5000' /etc/systemd/system/hifzhly.service
                systemctl daemon-reload
              fi
            fi

            # 3. Jalankan AI Worker via Docker Compose jika docker tersedia
            if command -v docker &> /dev/null && [ -f /opt/hifzhly/docker-compose.yml ]; then
              echo "Starting AI Worker via Docker Compose on port 5000..."
              cd /opt/hifzhly
              docker compose up -d --build ai-worker || true
            fi

            # 4. Restart backend service agar langsung memuat biner terbaru
            systemctl restart hifzhly.service
            systemctl status hifzhly.service --no-pager
