version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hifzhly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hifzhly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hifzhly_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hifzhly_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hifzhly_user} -d ${POSTGRES_DB:-hifzhly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: hifzhly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hifzhly-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-hifzhly_user}:${POSTGRES_PASSWORD:-hifzhly_secure_password_2026}@postgres:5432/${POSTGRES_DB:-hifzhly_db}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_hifzhly_fifa_hackathon_key_2026_xyz!}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hifzhly-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
