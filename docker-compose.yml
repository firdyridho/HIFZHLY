services:
  postgres:
    image: postgres:16-alpine
    container_name: hifzhly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hifzhly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hifzhly_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hifzhly_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hifzhly_user} -d ${POSTGRES_DB:-hifzhly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: hifzhly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: hifzhly-ai-worker
    restart: unless-stopped
    environment:
      - PORT=5000
    expose:
      - "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hifzhly-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    environment:
      - APP_PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-hifzhly_user}:${POSTGRES_PASSWORD:-hifzhly_secure_password_2026}@postgres:5432/${POSTGRES_DB:-hifzhly_db}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_hifzhly_fifa_hackathon_key_2026_xyz!}
      - AI_WORKER_URL=http://ai-worker:5000
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:

